name: Task Tracker daily sync

on:
  schedule:
    # 10:00 UTC = 6am Eastern Daylight Time (7am during winter, EST).
    # GitHub runs cron jobs in UTC and does not follow daylight saving,
    # so this drifts by an hour in November. Harmless - it just runs
    # a little earlier or later than 6am.
    - cron: "0 10 * * *"

  # Lets you trigger a run by hand from the Actions tab.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync tasks
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python sync_tasks.py
